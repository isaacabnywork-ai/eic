
name: Deploy Equip Indian Churches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eic-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure secure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH host-key configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu

          if [ -z "$VPS_HOST" ]; then
            echo "ERROR: VPS_HOST is empty."
            exit 1
          fi

          echo "Configured host: $VPS_HOST"
          echo "Known-hosts fingerprints:"
          ssh-keygen -lf ~/.ssh/known_hosts

          echo "Matching host-key entries:"
          ssh-keygen -F "$VPS_HOST" -f ~/.ssh/known_hosts || true

      - name: Diagnose VPS connectivity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu

          python3 - <<'PY'
          import os
          import socket

          host = os.environ["VPS_HOST"].strip()

          if not host or any(c in host for c in "/:@ \t\n"):
              raise SystemExit("VPS_HOST must be a hostname or IP address only.")

          print(f"Testing TCP connectivity to {host}:22")

          try:
              with socket.create_connection((host, 22), timeout=10):
                  print("SUCCESS: TCP port 22 is reachable.")
          except Exception as exc:
              print(f"FAILED: {type(exc).__name__}: {exc}")
              raise SystemExit(1)
          PY

      - name: Deploy application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          # Load Node.js and npm installed through NVM.
          export NVM_DIR="$HOME/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          # Fallback to the known Node.js installation path.
          if [ -d "$NVM_DIR/versions/node" ]; then
            NODE_VERSION_DIR="$(find "$NVM_DIR/versions/node" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            if [ -n "$NODE_VERSION_DIR" ]; then
              export PATH="$NODE_VERSION_DIR/bin:$PATH"
            fi
          fi

          # Find PM2 in the app user's NVM installation if necessary.
          if ! command -v pm2 >/dev/null 2>&1; then
            for PM2_BIN in "$NVM_DIR"/versions/node/*/bin/pm2; do
              if [ -x "$PM2_BIN" ]; then
                export PATH="$(dirname "$PM2_BIN"):$PATH"
                break
              fi
            done
          fi

          echo "Node: $(command -v node || true)"
          echo "npm: $(command -v npm || true)"
          echo "PM2: $(command -v pm2 || true)"

          if ! command -v node >/dev/null 2>&1 ||
             ! command -v npm >/dev/null 2>&1 ||
             ! command -v pm2 >/dev/null 2>&1; then
            echo "ERROR: Node.js, npm, or PM2 is unavailable."
            exit 1
          fi

          cd /home/equipindianchurches-app/htdocs/equipindianchurches.com

          echo "Fetching latest main branch..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building production application..."
          npm run build

          test -f dist/index.html

          echo "Reloading application..."
          if pm2 describe equipindianchurches >/dev/null 2>&1; then
            pm2 reload ecosystem.config.cjs --update-env
          else
            pm2 start ecosystem.config.cjs
          fi

          pm2 save

          echo "Checking local application response..."
          curl --fail --silent --show-error \
            http://127.0.0.1:3000/ >/dev/null

          echo "Deployment completed successfully."
          REMOTE
